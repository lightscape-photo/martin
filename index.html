<!DOCTYPE html>
<html lang="zh-TW" style="overflow-x: hidden;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Martin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0e;--surface:#161616;--surface2:#1e1e1e;--border:#252525;--border2:#333;
  --text:#e8e4de;--text2:#888;--text3:#444;
  --accent:#c8a96e;--accent2:#a07848;
  --blue:#3b82f6;--red:#ef4444;--green:#22c55e;
  --sidebar-w:220px;--topbar-h:52px;
  --radius:6px;--radius-lg:10px;
  --font-display:'Cormorant Garamond',serif;
  --font-mono:'DM Mono',monospace;
}
/* 強制鎖死橫向溢出 */
html,body{height:100%;font-family:var(--font-mono);font-size:12px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{display:flex;flex-direction:column;min-height:100dvh}
#app{flex:1;display:flex;flex-direction:column;min-height:0;overflow-x:hidden}

/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* BUTTONS */
input,button,select{font-family:inherit;font-size:12px;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border2);border-radius:var(--radius);background:transparent;cursor:pointer;color:var(--text);transition:all .15s;letter-spacing:.04em;white-space:nowrap}
.btn:hover{background:var(--surface2);border-color:var(--text3)}
.btn-primary{background:var(--accent);color:#0e0e0e;border-color:transparent;font-weight:400}
.btn-primary:hover{background:var(--accent2);opacity:1}
.btn-danger{color:var(--red);border-color:rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.08)}
.btn-sm{padding:4px 8px;font-size:11px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:8px 18px;border-radius:20px;font-size:12px;z-index:9999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══════════════════════════════════
   FRONTEND SHELL
═══════════════════════════════════ */
.shell{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface);max-width:1280px;width:100%;margin:0 auto}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:var(--topbar-h);border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;position:sticky;top:0;z-index:100}
.topbar-brand{font-family:var(--font-display);font-size:22px;font-weight:300;letter-spacing:.12em;color:var(--text);cursor:pointer;flex-shrink:0}
.topbar-brand span{color:var(--accent)}
.topbar-breadcrumb{flex:1;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);min-width:0;overflow:hidden}
.topbar-breadcrumb .crumb{color:var(--text2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-breadcrumb .crumb:hover{color:var(--text)}
.topbar-breadcrumb .sep{flex-shrink:0;color:var(--text3)}
.topbar-breadcrumb .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}

/* Mobile nav overlay */
.mobile-nav-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:190}
.mobile-nav-bg.open{display:block}

/* Layout */
.layout{flex:1;display:flex;min-height:0;overflow:hidden}

/* Sidebar */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);border-right:1px solid var(--border);background:var(--bg);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;transition:transform .25s ease}
.sidebar-label{padding:4px 18px 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 18px;cursor:pointer;color:var(--text2);border-left:2px solid transparent;transition:all .12s;font-size:12px}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(200,169,110,.06)}
.sidebar-divider{height:1px;background:var(--border);margin:4px 0}

/* Main content */
.fe-main{flex:1;overflow-y:auto;padding:28px 28px 40px;min-height:0;overflow-x:hidden}

/* View header */
.view-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px}
.view-title{font-family:var(--font-display);font-size:28px;font-weight:300;letter-spacing:.04em;color:var(--text);display:flex;align-items:center;gap:10px}
.view-meta{font-size:11px;color:var(--text3);letter-spacing:.06em;flex-shrink:0}

/* Back button */
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);cursor:pointer;padding:4px 0;background:none;border:none;margin-bottom:20px;letter-spacing:.04em;text-transform:uppercase}
.back-btn:hover{color:var(--text)}

/* Folder grid */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.folder-card{border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 16px 16px;cursor:pointer;background:var(--surface);transition:all .18s;position:relative;overflow:hidden}
.folder-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(200,169,110,.05) 0%,transparent 60%);opacity:0;transition:opacity .18s}
.folder-card:hover{border-color:var(--border2);background:var(--surface2)}
.folder-card:hover::before{opacity:1}
.folder-icon{font-size:22px;margin-bottom:12px;color:var(--accent);opacity:.8}
.folder-name{font-size:13px;font-weight:400;margin-bottom:4px;color:var(--text)}
.folder-count{font-size:11px;color:var(--text3);letter-spacing:.04em}

/* Category group */
.cat-group{margin-bottom:28px}
.cat-group-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:2px 0}
.cat-group-label:hover{color:var(--text)}

/* Statusbar */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;border-top:1px solid var(--border);background:var(--bg);font-size:10px;color:var(--text3);letter-spacing:.06em;flex-shrink:0}

/* Lock FAB */
.lock-fab{width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);transition:all .15s;flex-shrink:0}
.lock-fab:hover{color:var(--text2);border-color:var(--text3);background:var(--surface2)}

/* ═══════════════════════════════════
   PHOTO GALLERY — Justified Grid
═══════════════════════════════════ */
.jg-wrap{width:100%}
.jg-item{cursor:pointer;position:relative}
.jg-item:hover{filter:brightness(1.08)}
.jg-ov{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .2s;display:flex;align-items:flex-end;padding:8px}
.jg-item:hover .jg-ov{background:rgba(0,0,0,.4)}
.jg-lbl{font-size:10px;color:transparent;transition:color .2s;letter-spacing:.04em}
.jg-item:hover .jg-lbl{color:rgba(255,255,255,.75)}

/* ═══════════════════════════════════
   LIGHTBOX
═══════════════════════════════════ */
.lb-wrap{position:fixed;inset:0;background:rgba(8,8,8,.97);z-index:1000;display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.lb-ttl{font-size:12px;color:rgba(255,255,255,.4);letter-spacing:.06em}
.lb-xbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.4);border-radius:var(--radius);border:1px solid rgba(255,255,255,.1);background:transparent;transition:all .15s}
.lb-xbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;gap:16px;min-height:0;position:relative}
.lb-arr{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.4);border-radius:var(--radius);border:1px solid rgba(255,255,255,.1);background:transparent;font-size:18px;transition:all .15s}
.lb-arr.arr-l{left:20px}
.lb-arr.arr-r{right:20px}
.lb-arr:hover{background:rgba(255,255,255,.08);color:#fff}
.lb-arr.off{opacity:.15;cursor:default;pointer-events:none}
.lb-img-area{flex:1;align-self:stretch;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lb-img-area img, .lb-img-area svg{animation:lbFade .25s ease-out}
@keyframes lbFade{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}
.lb-strip{display:flex;gap:4px;padding:10px 20px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0}
.lb-thumb{flex-shrink:0;border-radius:3px;cursor:pointer;border:1.5px solid transparent;overflow:hidden;height:42px;opacity:.55;transition:opacity .15s}
.lb-thumb:hover{opacity:.85}
.lb-thumb.cur{border-color:var(--accent);opacity:1}
.lb-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 14px;flex-shrink:0}
.lb-lbl{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.04em}
.kb-hint{font-size:10px;color:rgba(255,255,255,.18);letter-spacing:.06em}

/* ═══════════════════════════════════
   LOGIN
═══════════════════════════════════ */
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(4px)}
.login-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:28px;width:300px}
.login-logo{font-family:var(--font-display);font-size:20px;font-weight:300;margin-bottom:4px;letter-spacing:.08em;color:var(--text)}
.login-sub{font-size:11px;color:var(--text3);margin-bottom:20px;letter-spacing:.06em}
.form-lbl{font-size:10px;color:var(--text2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.form-inp{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none;font-family:inherit;font-size:13px;transition:border-color .15s}
.form-inp:focus{border-color:var(--accent)}

/* ═══════════════════════════════════
   ADMIN SHELL
═══════════════════════════════════ */
.ad-shell{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface);max-width:1280px;width:100%;margin:0 auto}
.ad-topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:var(--topbar-h);border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.badge-ok{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(34,197,94,.1);color:var(--green);letter-spacing:.04em;border:1px solid rgba(34,197,94,.2)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border);color:var(--text3)}
.ad-layout{flex:1;display:flex;min-height:0;overflow:hidden}
.ad-sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg);flex-shrink:0;transition:transform .25s ease}
.ad-sb-top{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.ad-sb-scroll{flex:1;overflow-y:auto;padding:8px 0}
.ad-nav-item{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;cursor:pointer;border-left:2px solid transparent;color:var(--text2);font-size:12px;transition:all .12s}
.ad-nav-item:hover{background:var(--surface);color:var(--text)}
.ad-nav-item.active{background:rgba(200,169,110,.06);color:var(--accent);border-left-color:var(--accent)}
.ad-nav-il{display:flex;align-items:center;gap:7px}
.ad-nav-ct{font-size:10px;color:var(--text3);background:var(--surface2);padding:1px 6px;border-radius:10px}
.ad-nav-grp{padding:10px 14px 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:5px}
.ad-nav-grp:hover{color:var(--text2)}
.ad-main{flex:1;overflow-y:auto;padding:24px;min-height:0;overflow-x:hidden}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stat-card{background:var(--surface2);border-radius:var(--radius-lg);padding:16px 18px;border:1px solid var(--border)}
.stat-lbl{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.stat-val{font-family:var(--font-display);font-size:32px;font-weight:300;color:var(--text)}
.al-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.al-card{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg);transition:border-color .15s}
.al-card:hover{border-color:var(--border2)}
.al-thumb{height:80px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:26px;background:var(--surface2)}
.al-info{padding:10px 12px;border-top:1px solid var(--border)}
.al-name{font-size:12px;font-weight:400;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.al-sub{font-size:10px;color:var(--text3)}
.al-acts{display:flex;gap:4px;padding:8px 10px;border-top:1px solid var(--border)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.ph-item{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);cursor:grab;user-select:none;transition:transform .18s,box-shadow .18s,opacity .18s}
.ph-item:active{cursor:grabbing}
.ph-item.dragging{opacity:.25;transform:scale(.92)}
.ph-item.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);transform:scale(1.04)}
.ph-item.sel{outline:2px solid var(--accent);outline-offset:-2px}
.ph-ov{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.ph-item:hover .ph-ov{background:rgba(0,0,0,.5)}
.drag-hint{font-size:11px;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.upload-zone{border:1.5px dashed var(--border2);border-radius:var(--radius-lg);padding:28px;text-align:center;cursor:pointer;transition:all .15s}
.upload-zone:hover,.upload-zone.dz{border-color:var(--accent);background:rgba(200,169,110,.04)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(3px)}
.modal{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:24px;width:360px;max-width:92vw}
.modal-title{font-family:var(--font-display);font-size:18px;font-weight:300;margin-bottom:16px;color:var(--text)}
.modal-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.bc{font-size:11px;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:4px}
.bcl{cursor:pointer;color:var(--text2)}
.bcl:hover{color:var(--text)}
.hr{height:1px;background:var(--border);margin:4px 0}
.view-acts{display:flex;gap:6px;flex-wrap:wrap}

/* ═══════════════════════════════════
   MOBILE MENU TOGGLE
═══════════════════════════════════ */
.menu-toggle{display:none;align-items:center;justify-content:center;width:32px;height:32px;cursor:pointer;color:var(--text2);border:1px solid var(--border);border-radius:var(--radius);background:transparent;flex-shrink:0}
.menu-toggle:hover{color:var(--text);background:var(--surface2)}

/* ═══════════════════════════════════
   RESPONSIVE — MOBILE
═══════════════════════════════════ */
@media (max-width: 700px) {
  :root{--sidebar-w:260px;--topbar-h:48px}
  body{font-size:13px}

  .menu-toggle{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.5);overflow-y:auto;}
  .sidebar.open{transform:translateX(0)}
  .ad-sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.5);}
  .ad-sidebar.open{transform:translateX(0)}
  .layout{flex-direction:column}
  .fe-main{padding:16px 14px 60px}
  .ad-main{padding:16px 14px 60px}
  .topbar{padding:0 12px;gap:8px}
  .ad-topbar{padding:0 12px}
  .topbar-brand{font-size:18px}
  .topbar-breadcrumb{font-size:10px}
  .tag{display:none}
  .view-header{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:16px}
  .view-title{font-size:22px}
  .folder-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .folder-card{padding:14px 12px 12px}
  .stat-row{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat-card{padding:10px 10px}
  .stat-val{font-size:22px}
  .stat-lbl{font-size:9px}
  .al-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .ph-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
  .lb-stage{padding:0}
  .lb-arr{width:32px;height:32px}
  .lb-arr.arr-l{left:10px}
  .lb-arr.arr-r{right:10px}
  .lb-strip{padding:8px 12px}
  .kb-hint{display:none}
  .lb-top{padding:10px 14px}
  .lb-foot{padding:6px 14px 12px}
  .ad-topbar-brand-text{display:none}
  .statusbar{padding:6px 14px}
  .view-acts{flex-wrap:wrap}
}
@media (min-width: 701px) and (max-width: 1024px) {
  :root{--sidebar-w:180px}
  .fe-main{padding:20px 20px 40px}
  .ad-main{padding:20px 20px 40px}
  .folder-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .stat-val{font-size:26px}
}
</style>
</head>

function genPh(n,base,ratios){
  var a=[];
  for(var i=0;i<n;i++){
    var nb=parseInt(base.slice(1),16),r=(nb>>16)&255,g=(nb>>8)&255,b=nb&255,sh=(i/Math.max(n-1,1)-.5)*45;
    function cl(v){return Math.min(255,Math.max(0,Math.round(v+sh)));}
    var c='#'+[cl(r),cl(g),cl(b)].map(function(v){return v.toString(16).padStart(2,'0')}).join('');
    a.push({id:'p'+i,r:ratios[i%ratios.length],color:c,label:'IMG_'+(1000+i)});
  }
  return a;
}
function lighten(hex,a){
  var n=parseInt(hex.slice(1),16);
  var r=Math.min(255,((n>>16)&255)+Math.round(255*a));
  var g=Math.min(255,((n>>8)&255)+Math.round(255*a));
  var b=Math.min(255,(n&255)+Math.round(255*a));
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0')}).join('');
}

function ic(name,size){
  size=size||14;
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',size);s.setAttribute('height',size);
  s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');
  s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.8');
  s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');
  s.style.flexShrink='0';s.style.verticalAlign='middle';
  s.innerHTML=PATHS[name]||'';
  return s;
}
function mkEl(tag,cls,txt){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=txt;
  return e;
}
function mkSVG(w,h,color){
  var lc=lighten(color,.2);
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',w);s.setAttribute('height',h);
  s.setAttribute('viewBox','0 0 '+w+' '+h);s.style.display='block';
  function mkR(attrs){var r=document.createElementNS('http://www.w3.org/2000/svg','rect');Object.keys(attrs).forEach(function(k){r.setAttribute(k,attrs[k]);});return r;}
  function mkC(attrs){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');Object.keys(attrs).forEach(function(k){c.setAttribute(k,attrs[k]);});return c;}
  s.appendChild(mkR({width:w,height:h,fill:color}));
  s.appendChild(mkR({x:w*.08,y:h*.1,width:w*.84,height:h*.8,rx:2,stroke:lc,'stroke-width':1,fill:'none',opacity:.35}));
  s.appendChild(mkC({cx:w*.5,cy:h*.5,r:Math.min(w,h)*.12,stroke:lc,'stroke-width':1,fill:'none',opacity:.35}));
  return s;
}

function buildFEMain(main){

      var f=DATA[fk];
      var grp=mkEl('div','cat-group');
      var lbl=mkEl('div','cat-group-label');

      lbl.appendChild(document.createTextNode(f.label));
      lbl.onclick=(function(k){return function(){feGoFolder(k);};})(fk);
      grp.appendChild(lbl);
      var grid=mkEl('div','folder-grid');
      Object.keys(f.albums).forEach(function(ak){
        grid.appendChild(buildFolderCard(f.albums[ak].label,f.albums[ak].photos.length,(function(fk2,ak2){return function(){feGoAlbum(fk2,ak2);};})(fk,ak)));
      });
      grp.appendChild(grid);
      main.appendChild(grp);
    });

function buildJG(wrap,photos,onClickPhoto){
  wrap.innerHTML='';
  if(!photos||!photos.length)return;
  var gap=8,targetH=isMobile()?150:200,maxPerRow=isMobile()?3:5;
  var rows=[],i=0;
  // Group photos into rows by accumulated aspect ratio
  while(i<photos.length){
    var row=[],sumR=0;
    while(i<photos.length){
      row.push(photos[i]);
      sumR+=photos[i].r;
      i++;
      // break when row is "full enough" based on ratio sum
      if(row.length>=2&&sumR>=(isMobile()?2.2:3.5))break;
      if(row.length>=maxPerRow)break;
    }
    rows.push(row);
  }
  rows.forEach(function(row,ri){
    var isLastRow=ri===rows.length-1&&row.length<2;
    var rowEl=document.createElement('div');
    rowEl.style.cssText=[
      'display:flex',
      'gap:'+gap+'px',
      'margin-bottom:'+gap+'px',
      isLastRow?'':'width:100%'
    ].join(';');
    row.forEach(function(p){
      var pidx=photos.indexOf(p);
      var item=document.createElement('div');
      // Key: flex-grow=aspect-ratio makes browser distribute width proportionally
      // aspect-ratio keeps height consistent across the row
      item.style.cssText=[
        isLastRow?'flex:0 0 auto':'flex:'+p.r+' '+p.r+' 0%',
        'aspect-ratio:'+p.r,
        'height:'+targetH+'px',
        'overflow:hidden',
        'border-radius:4px',
        'cursor:pointer',
        'position:relative',
        'background:var(--surface2)',
        isLastRow?'width:'+Math.round(p.r*targetH)+'px':''
      ].filter(Boolean).join(';');
      item.addEventListener('click',function(){onClickPhoto(pidx);});
      if(p.src){
        var img=document.createElement('img');
        img.src=p.src;
        img.style.cssText='width:100%;height:100%;object-fit:cover;display:block';
        item.appendChild(img);
      }else{
        item.appendChild(mkSVG(Math.round(p.r*targetH),targetH,p.color));
      }
      var ov=mkEl('div','jg-ov');
      ov.appendChild(mkEl('span','jg-lbl',p.label));
      item.appendChild(ov);
      rowEl.appendChild(item);
    });
    wrap.appendChild(rowEl);
  });
}

function bindDrag(grid){
  if(!grid)return;
  grid.querySelectorAll('.ph-item').forEach(function(item){
    item.addEventListener('dragstart',function(e){
      dragSrc=parseInt(item.dataset.idx);e.dataTransfer.effectAllowed='move';
      setTimeout(function(){item.classList.add('dragging');},0);
    });
    item.addEventListener('dragend',function(){
      document.querySelectorAll('.ph-item').forEach(function(x){x.classList.remove('dragging');x.classList.remove('drag-over');});
    });
    item.addEventListener('dragover',function(e){
      e.preventDefault();
      grid.querySelectorAll('.ph-item').forEach(function(x){x.classList.remove('drag-over');});
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave',function(){item.classList.remove('drag-over');});
    item.addEventListener('drop',function(e){
      e.preventDefault();
      document.querySelectorAll('.ph-item').forEach(function(x){x.classList.remove('dragging');x.classList.remove('drag-over');});
      var tgt=parseInt(item.dataset.idx);
      if(dragSrc===null||dragSrc===tgt)return;
      var ph=DATA[adF].albums[adA].photos;
      ph.splice(tgt,0,ph.splice(dragSrc,1)[0]);
      dragSrc=null;adSel=[];
      var par=document.getElementById('phGrid').parentElement;
      var ng=document.createElement('div');ng.className='ph-grid';ng.id='phGrid';
      DATA[adF].albums[adA].photos.forEach(function(p,i){ng.appendChild(buildPhItem(p,i));});
      par.replaceChild(ng,document.getElementById('phGrid'));
      bindDrag(ng);showToast('順序已調整');
    });
  });
}

    var acts=mkEl('div','modal-acts');
    var cancel=mkEl('button','btn','取消');cancel.onclick=function(){adModal=null;render();};
    var submit=mkEl('button','btn btn-primary','建立');
    submit.onclick=function(){
      var fk=document.getElementById('mFk').value,n=(document.getElementById('mName').value||'').trim();
      if(!n)return;DATA[fk].albums['al'+Date.now()]={label:n,photos:[]};showToast('相本「'+n+'」已建立');adModal=null;render();
    };
    acts.appendChild(cancel);acts.appendChild(submit);modal.appendChild(acts);
  } else if(adModal==='rename'){
    modal.appendChild(mkEl('div','modal-title','重新命名'));
    modal.appendChild(mkEl('div','form-lbl','相本名稱'));
    var inp2=document.createElement('input');inp2.type='text';inp2.className='form-inp';inp2.id='mName';
    inp2.value=adA&&adF?DATA[adF].albums[adA].label:'';inp2.style.marginBottom='4px';modal.appendChild(inp2);
    var acts2=mkEl('div','modal-acts');
    var cancel2=mkEl('button','btn','取消');cancel2.onclick=function(){adModal=null;render();};
    var submit2=mkEl('button','btn btn-primary','儲存');
    submit2.onclick=function(){var n=(document.getElementById('mName').value||'').trim();if(!n)return;DATA[adF].albums[adA].label=n;showToast('已重新命名');adModal=null;render();};
    acts2.appendChild(cancel2);acts2.appendChild(submit2);modal.appendChild(acts2);
  } else if(adModal==='upload'){
    modal.appendChild(mkEl('div','modal-title','上傳照片'));
    var zone=mkEl('div','upload-zone');
    zone.innerHTML='<div style="font-size:28px;margin-bottom:8px">☁</div><p style="color:var(--text2);font-size:12px;margin-bottom:4px">點擊選取或拖曳照片</p><small style="color:var(--text3);font-size:10px;letter-spacing:.06em">JPG / PNG / WEBP</small>';
    var fi=document.createElement('input');fi.type='file';fi.multiple=true;fi.accept='image/*';fi.style.display='none';
    zone.onclick=function(){fi.click();};
    zone.ondragover=function(e){e.preventDefault();zone.classList.add('dz');};
    zone.ondragleave=function(){zone.classList.remove('dz');};
    zone.ondrop=function(e){e.preventDefault();zone.classList.remove('dz');pendFiles=Array.from(e.dataTransfer.files).filter(function(f){return f.type.startsWith('image/');});updateFileList();};
    fi.onchange=function(){pendFiles=Array.from(fi.files);updateFileList();};
    modal.appendChild(zone);modal.appendChild(fi);
    var flist=mkEl('div','');flist.id='fList';flist.style.cssText='margin-top:8px;max-height:100px;overflow-y:auto';modal.appendChild(flist);
    var acts3=mkEl('div','modal-acts');
    var cancel3=mkEl('button','btn','關閉');cancel3.onclick=function(){adModal=null;pendFiles=[];render();};
    
    var submit3=mkEl('button','btn btn-primary','上傳');
    submit3.onclick=function(){
      if(!pendFiles.length){showToast('請先選擇照片');return;}
      var al=DATA[adF].albums[adA];
      var processed = 0;
      var total = pendFiles.length;
      submit3.innerHTML = '解析中...';
      submit3.disabled = true;
      
      pendFiles.forEach(function(f,i){
        var reader = new FileReader();
        reader.onload = function(e){
          var img = new Image();
          img.onload = function(){
            al.photos.push({
              id: 'u'+Date.now()+i,
              r: img.width / img.height,
              color: lighten(DATA[adF].color, i*.05),
              label: f.name.replace(/\.[^.]+$/,''),
              src: e.target.result
            });
            processed++;
            if(processed === total){
              showToast('已新增 '+total+' 張照片');
              pendFiles=[];adModal=null;render();
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(f);
      });
    };
    
    acts3.appendChild(cancel3);acts3.appendChild(submit3);modal.appendChild(acts3);
  }
  ov.appendChild(modal);
  setTimeout(function(){var e=document.getElementById('mName');if(e)e.focus();},30);
  return ov;
}
function updateFileList(){
  var ul=document.getElementById('fList');if(!ul)return;ul.innerHTML='';
  pendFiles.forEach(function(f){var d=mkEl('div','');d.style.cssText='padding:3px 0;font-size:11px;color:var(--text2)';d.textContent=f.name;ul.appendChild(d);});
}

document.addEventListener('keydown',function(e){
  if(lbOpen){if(e.key==='ArrowLeft'){e.preventDefault();prevLB();}else if(e.key==='ArrowRight'){e.preventDefault();nextLB();}else if(e.key==='Escape')closeLB();}
  else if(showLogin&&e.key==='Escape'){showLogin=false;render();}
  else if(sidebarOpen&&e.key==='Escape'){closeSidebar();}
});
window.addEventListener('resize',function(){
  if(feView==='album'&&!lbOpen){var w=document.getElementById('jgWrap');if(w)buildJG(w,DATA[feFolder].albums[feAlbum].photos,function(i){openLB(i);});}
});

render();

// --- 自動化封裝：徹底封鎖後台入口 ---
function toggleLogin(){ showToast('此為純前台展示模式，後台功能已在此版本中剝離。'); }
</script>
</body>
</html>
